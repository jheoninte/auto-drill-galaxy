<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Drill: Galaxy</title><style>body{margin:0;background:#020617;color:#fff;font:14px Arial}#ui{position:fixed;left:12px;top:12px;width:320px;background:#0f172acc;padding:14px;border-radius:14px}button{margin:4px;padding:8px 10px;border:0;border-radius:8px;background:#2563eb;color:#fff}canvas{display:block}.muted{color:#94a3b8;font-size:12px}</style><div id=ui><h3>Auto Drill: Galaxy</h3><div><button id=g>Gacha</button><button id=m>Merge</button><button id=p>Prestige</button></div><p id=stat></p><p class=muted>궤도를 도는 채굴선이 자동으로 광석을 모읍니다.</p></div><canvas id=c></canvas><script>const c=document.getElementById("c"),x=c.getContext("2d"),stat=document.getElementById("stat");let ore=0,dps=6,wave=1,dark=0,a=0,parts={hull:1,engine:1,reactor:1};function rs(){c.width=innerWidth;c.height=innerHeight}function loop(){a+=0.02*(1+parts.engine*0.05);ore+=dps*0.08*(1+parts.reactor*0.03);if(ore>wave*120){ore-=wave*60;wave++}x.fillStyle="#020617";x.fillRect(0,0,c.width,c.height);const cx=c.width*.68,cy=c.height*.56,r=120,sx=cx+Math.cos(a)*r,sy=cy+Math.sin(a)*r;x.beginPath();x.strokeStyle="#334155";x.arc(cx,cy,r,0,7);x.stroke();x.beginPath();x.fillStyle="#f59e0b";x.arc(cx,cy,60,0,7);x.fill();x.beginPath();x.fillStyle="#38bdf8";x.arc(sx,sy,14,0,7);x.fill();stat.textContent="Wave "+wave+" · Ore "+ore.toFixed(0)+" · Dark "+dark+" · DPS "+dps.toFixed(1)+" · H/E/R "+parts.hull+"/"+parts.engine+"/"+parts.reactor;requestAnimationFrame(loop)}g.onclick=()=>{if(ore>=50){ore-=50;dps+=2+Math.random()*2}};m.onclick=()=>{if(ore>=80){ore-=80;parts.engine++;parts.reactor++;dps+=2}};p.onclick=()=>{if(wave>=8){dark+=Math.floor(wave/4);wave=1;ore=0;dps=6+dark*1.5}};onresize=rs;rs();requestAnimationFrame(loop);</script>
