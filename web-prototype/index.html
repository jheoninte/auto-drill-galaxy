<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Auto Drill: Galaxy</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#0f172a,#020617 70%);color:#e2e8f0;overflow:hidden}.panel{position:fixed;top:16px;left:16px;width:360px;padding:16px;background:rgba(15,23,42,.86);border-radius:18px;backdrop-filter:blur(10px);z-index:3}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}button{border:none;border-radius:10px;padding:10px 12px;background:#2563eb;color:white;cursor:pointer}.alt{background:#334155}.stat{font-size:13px;color:#cbd5e1;margin-top:4px}canvas{display:block}</style></head><body><section class="panel"><h2 style="margin:0 0 10px;">Auto Drill: Galaxy</h2><div class="row"><button id="gachaBtn">Skill Gacha</button><button id="mergeBtn" class="alt">Merge Parts</button><button id="prestigeBtn" class="alt">Prestige</button><button id="speedBtn" class="alt">1x</button></div><div class="stat" id="stats"></div><div class="stat" id="parts"></div><div class="stat" id="skills"></div></section><canvas id="canvas"></canvas><script>const c=document.getElementById('canvas'),x=c.getContext('2d'),stats=document.getElementById('stats'),parts=document.getElementById('parts'),skills=document.getElementById('skills'),K='auto-drill-galaxy-save-v1';const st={timeScale:1,ore:0,darkMatter:0,orbitAngle:0,dps:6,crit:.08,asteroidHp:600,wave:1,ship:{hull:1,engine:1,reactor:1},skills:[],loot:{iron:0,crystal:0,plasma:0,relic:0}};const pool=[{name:'Laser Burst',dps:2},{name:'Auto Merge',dps:1},{name:'Vacuum Magnet',dps:1.5},{name:'Overclock Reactor',dps:3},{name:'Crit Sensor',crit:.05}];function resize(){c.width=innerWidth;c.height=innerHeight}function save(){localStorage.setItem(K,JSON.stringify(st))}function load(){try{Object.assign(st,JSON.parse(localStorage.getItem(K)||'{}'))}catch{}}function loot(){const r=Math.random();if(r<.45)st.loot.iron++;else if(r<.72)st.loot.crystal++;else if(r<.93)st.loot.plasma++;else st.loot.relic++}function adv(dt){st.orbitAngle+=dt*.0016*st.timeScale*(1+st.ship.engine*.08);const crit=Math.random()<st.crit?2.2:1,damage=st.dps*crit*st.timeScale*(1+st.ship.reactor*.06)*dt*.06;st.asteroidHp-=damage;st.ore+=damage*.52;if(st.asteroidHp<=0){st.wave++;st.asteroidHp=600+st.wave*120;st.ore+=20+st.wave*4;loot();if(st.wave%4===0)st.ship.hull++;save()}}function draw(){x.clearRect(0,0,c.width,c.height);for(let i=0;i<120;i++){x.fillStyle=i%8===0?'#60a5fa':'#cbd5e1';x.fillRect((i*137)%c.width,(i*71)%c.height,2,2)}const cx=c.width*.68,cy=c.height*.53,r=120;x.strokeStyle='rgba(96,165,250,0.28)';x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();const hp=Math.max(0,st.asteroidHp)/(600+st.wave*120);x.fillStyle='#475569';x.beginPath();x.arc(cx,cy,72,0,Math.PI*2);x.fill();x.fillStyle='#f59e0b';x.beginPath();x.arc(cx,cy,72*hp,0,Math.PI*2);x.fill();const sx=cx+Math.cos(st.orbitAngle)*r,sy=cy+Math.sin(st.orbitAngle)*r;x.fillStyle='#38bdf8';x.beginPath();x.arc(sx,sy,14,0,Math.PI*2);x.fill();x.fillStyle='#e879f9';x.fillRect(sx-4,sy-20,8,10);stats.textContent=`Wave ${st.wave} · Ore ${st.ore.toFixed(0)} · Dark Matter ${st.darkMatter} · DPS ${st.dps.toFixed(1)} · Crit ${(st.crit*100).toFixed(0)}%`;parts.textContent=`Parts — Hull ${st.ship.hull} / Engine ${st.ship.engine} / Reactor ${st.ship.reactor}`;skills.textContent=`Skills — ${st.skills.length?st.skills.join(', '):'none yet'}`}document.getElementById('gachaBtn').onclick=()=>{if(st.ore<50)return;st.ore-=50;const rw=pool[Math.floor(Math.random()*pool.length)];st.skills.push(rw.name);st.dps+=rw.dps||0;st.crit+=rw.crit||0;save()};document.getElementById('mergeBtn').onclick=()=>{if(st.loot.iron>=5){st.loot.iron-=5;st.ship.engine++;st.ship.reactor++;st.dps+=2;save()}};document.getElementById('prestigeBtn').onclick=()=>{if(st.wave<8)return;st.darkMatter+=Math.floor(st.wave/4);st.wave=1;st.asteroidHp=600;st.ore=0;st.dps=6+st.darkMatter*1.6;st.crit=.08+st.darkMatter*.01;save()};document.getElementById('speedBtn').onclick=e=>{st.timeScale=st.timeScale===1?2:1;e.target.textContent=`${st.timeScale}x`};let last=performance.now();function loop(now){const dt=now-last;last=now;adv(dt);draw();requestAnimationFrame(loop)}load();resize();addEventListener('resize',resize);requestAnimationFrame(loop);</script></body></html>
